name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Проверки ядра
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Скачать ядро
        run: node scripts/fetch-resources.mjs
      - name: Типы
        run: npm run typecheck
      - name: Генератор конфигов против настоящего sing-box
        run: node scripts/run-validate.mjs
      - name: Сквозной прогон трафика через ядро
        run: node scripts/run-e2e.mjs

  windows:
    name: Сборка под Windows
    runs-on: windows-latest
    # Релиз не выпускаем, если проверки ядра не прошли
    needs: checks
    permissions:
      # Без этого публикация релиза падает с 403: по умолчанию токен только на чтение
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Скачать ядро и wintun
        run: node scripts/fetch-resources.mjs
      - name: Собрать
        run: npm run build
      - name: Упаковать .exe
        run: npx electron-builder --win --x64 --publish never

      - name: Контрольные суммы
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Prism-windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Выложить в релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Prism ${{ github.ref_name }}
          body_path: .github/release-body.md
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
