name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Проверки ядра
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Скачать ядро
        run: node scripts/fetch-resources.mjs
      - name: Типы
        run: npm run typecheck
      - name: Генератор конфигов против настоящего sing-box
        run: node scripts/run-validate.mjs
      - name: Живучесть хранилища
        run: node scripts/run-store-test.mjs
      - name: Сквозной прогон трафика через ядро
        run: |
          set +e
          node scripts/run-e2e.mjs 2>&1 | tee /tmp/e2e.log
          code=${PIPESTATUS[0]}
          {
            echo '### Сквозной тест'
            echo '```'
            cat /tmp/e2e.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $code -ne 0 ]; then
            # Логи прогона недоступны без токена — выносим суть в аннотацию
            msg=$(grep -E '❌|Error|error' /tmp/e2e.log | head -12 | sed ':a;N;$!ba;s/\n/ § /g')
            echo "::error title=Сквозной тест упал::${msg}"
          fi
          exit $code

  windows:
    name: Сборка под Windows
    runs-on: windows-latest
    # Релиз не выпускаем, если проверки ядра не прошли
    needs: checks
    permissions:
      # Без этого публикация релиза падает с 403: по умолчанию токен только на чтение
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Скачать ядро и wintun
        run: node scripts/fetch-resources.mjs
      - name: Собрать
        run: npm run build
      - name: Упаковать .exe
        run: npx electron-builder --win --x64 --publish never

      - name: Контрольные суммы
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Prism-windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Выложить в релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Prism ${{ github.ref_name }}
          body_path: .github/release-body.md
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt

  macos:
    name: Сборка под macOS
    runs-on: macos-latest
    needs: checks
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Go нужен для привилегированного помощника — на раннере он уже есть,
      # фиксируем версию, чтобы сборка не поехала на обновлении образа
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: npm ci
      - name: Скачать ядро
        run: node scripts/fetch-resources.mjs
      - name: Собрать помощник
        run: npm run build:helper
      - name: Проверить помощник
        run: npm run test:helper
      - name: Собрать
        run: npm run build
      - name: Упаковать .dmg
        # Сертификата Developer ID в CI нет, подписываем ad-hoc: без подписи
        # приложение на Apple Silicon просто не запустится. Нотаризации нет,
        # поэтому Gatekeeper будет ругаться — об этом сказано в описании релиза.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      - name: Контрольные суммы
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip > SHA256SUMS-mac.txt
          cat SHA256SUMS-mac.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Prism-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/SHA256SUMS-mac.txt
          retention-days: 30

      - name: Выложить в релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Prism ${{ github.ref_name }}
          body_path: .github/release-body.md
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/SHA256SUMS-mac.txt
