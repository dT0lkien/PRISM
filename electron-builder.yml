appId: com.prism.vpn
productName: Prism
copyright: Prism VPN

directories:
  buildResources: build
  output: dist

# Нужен, чтобы electron-builder положил рядом latest.yml и app-update.yml —
# без них автообновление не работает
publish:
  provider: github
  owner: dT0lkien
  repo: prism-vpn

files:
  - out/**/*
  - package.json

# Общее для всех платформ. Ядро и помощник добавляются в секциях win/mac:
# класть в сборку оба ядра — это лишняя сотня мегабайт, а helper нужен только
# на macOS.
extraResources:
  - from: resources/rules
    to: rules
    filter: ['**/*.srs']
  - from: resources/icons
    to: icons
    filter: ['**/*.png']

asar: true
compression: maximum
electronLanguages: [en-US, ru-RU]

win:
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  extraResources:
    - from: resources/core/win
      to: core
      filter: ['**/*']
    - from: resources/rules
      to: rules
      filter: ['**/*.srs']
    - from: resources/icons
      to: icons
      filter: ['**/*.png']
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Prism
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  runAfterFinish: true

portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  icon: build/icon.icns
  category: public.app-category.utilities
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Туннель поднимает не приложение, а привилегированный помощник, поэтому
  # самому приложению никаких особых прав не нужно.
  extendInfo:
    LSMinimumSystemVersion: '11.0'
    NSHumanReadableCopyright: Prism VPN
  extraResources:
    - from: resources/core/mac
      to: core
      filter: ['**/*']
    # Помощник и его скрипты: приложение зовёт install.sh через osascript,
    # он же копирует бинарь в /Library/PrivilegedHelperTools.
    - from: resources/helper
      to: helper
      filter: ['prism-helper']
    - from: helper
      to: helper
      filter: ['install.sh', 'uninstall.sh', 'verify-install.sh']
    - from: resources/rules
      to: rules
      filter: ['**/*.srs']
    - from: resources/icons
      to: icons
      filter: ['**/*.png']

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
