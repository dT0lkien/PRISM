# Урезанный вариант проекта — только приложение, без расширения туннеля.
#
# Зачем. Энтайтлменты Network Extensions и App Groups выдаются лишь платному
# аккаунту Apple Developer; бесплатная personal team их не поддерживает, и Xcode
# отказывается подписывать сборку целиком. Здесь их нет, поэтому приложение
# ставится на устройство обычным Apple ID.
#
# Что работает: список серверов, разбор ссылок, генерация конфига.
# Что не работает: туннель. Кнопка подключения покажет отказ системы.
#
# Генерация:
#   cd ios && xcodegen --spec project-free.yml
# Полная версия остаётся в project.yml и генерируется как обычно.
#
# Отдельный файл, а не include с переопределениями: XcodeGen сливает массивы
# непредсказуемо, и «убрать зависимость» через наследование не выражается.
# Тридцать строк дублирования честнее неявной магии.

name: Prism

options:
  bundleIdPrefix: com.prism
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40.0"

packages:
  PrismCore:
    path: PrismCore

targets:
  Prism:
    type: application
    platform: iOS
    sources:
      - path: Prism
    dependencies:
      - package: PrismCore
        product: PrismCore
    info:
      path: Prism/Info.plist
      properties:
        CFBundleDisplayName: Prism
        CFBundleShortVersionString: "1.1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prism.vpn
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Энтайтлментов нет намеренно — иначе personal team не подпишет
